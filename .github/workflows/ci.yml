name: Desktop Checks (Manual)
on:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit or ref (blank verifies everything)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
jobs:
  plan:
    runs-on: windows-2025
    outputs:
      desktop: ${{ steps.plan.outputs.desktop }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: plan
        name: Select current product checks
        env:
          BASE: ${{ inputs.base }}
        run: |
          if ($env:BASE -and $env:BASE -notmatch '^0+$') { node scripts/desktop/plan.mjs --base $env:BASE }
          else { node scripts/desktop/plan.mjs --all }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check changed documentation
        if: steps.plan.outputs.desktop == 'false'
        run: |
          node scripts/desktop/docs.mjs --plan-file .cache/validation/plan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload selected plan
        if: steps.plan.outputs.desktop == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-validation-plan-${{ github.sha }}
          path: .cache/validation/plan.json
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 1
  desktop:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download selected plan
        uses: actions/download-artifact@v8
        with:
          name: desktop-validation-plan-${{ github.sha }}
          path: .cache/validation
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-go@v7
        if: needs.plan.outputs.go == 'true'
        with:
          go-version-file: native/evostack/backend/go.mod
          cache: false
      - name: Prepare project-local caches
        run: |
          . ./native/evostack/prepare-env.ps1
          'C:\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ACTIONLINT=$env:GOPATH\bin\actionlint.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOPATH=$env:GOPATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOMODCACHE=$env:GOMODCACHE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOCACHE=$env:GOCACHE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=$env:CARGO_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare Rust toolchain when selected
        if: needs.plan.outputs.rust == 'true'
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v5
        with:
          path: |
            .pnpm-store
            native/evostack/.cache/go/pkg/mod
            native/evostack/.cache/go-build
            native/evostack/.cache/cargo/registry
            native/evostack/.cache/cargo/git
            native/evostack/.cache/target
          key: desktop-windows-${{ runner.arch }}-rust1.98.0-${{ hashFiles('.node-version', 'native/evostack/backend/go.mod') }}-${{ hashFiles('pnpm-lock.yaml', 'native/evostack/backend/go.sum', 'native/evostack/src-tauri/Cargo.lock') }}
          restore-keys: desktop-windows-${{ runner.arch }}-rust1.98.0-${{ hashFiles('.node-version', 'native/evostack/backend/go.mod') }}-
      - name: Install pinned dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install workflow validator when selected toolchains need Go
        if: needs.plan.outputs.go == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selected verification once
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: pnpm verify --plan-file .cache/validation/plan.json --expected-revision $env:EXPECTED_REVISION
      - uses: actions/upload-artifact@v7
        if: success() && hashFiles('native/evostack/dist/*.zip') != ''
        with:
          name: TinyCherry-Windows-${{ github.sha }}
          path: native/evostack/dist/*.zip
          if-no-files-found: error
  result:
    if: always()
    needs: [plan, desktop]
    runs-on: windows-2025
    steps:
      - name: Require every selected job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_EXPECTED: ${{ needs.plan.outputs.desktop }}
        run: |
          if ($env:PLAN_RESULT -ne 'success') { throw 'Validation planning or documentation failed' }
          $expected = if ($env:DESKTOP_EXPECTED -eq 'true') { 'success' } else { 'skipped' }
          if ($env:DESKTOP_RESULT -ne $expected) { throw "Desktop validation expected $expected, received $env:DESKTOP_RESULT" }
