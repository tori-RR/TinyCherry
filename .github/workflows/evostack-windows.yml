name: EvoStack Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main, evostack]
  pull_request:
    branches: [main, evostack]

permissions:
  contents: read

concurrency:
  group: evostack-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      EVOSTACK_EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify checkout and WebView2 Runtime
        run: |
          ./native/evostack/verify-source.ps1 -ExpectedRevision $env:EVOSTACK_EXPECTED_REVISION
          ./native/evostack/check-webview2.ps1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/evostack/backend/go.mod
          cache: false
      - name: Set up Rust toolchain and race-test compiler
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mingw = 'C:\mingw64\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mingw 'gcc.exe'))) { throw 'Hosted MinGW-w64 GCC is required for Go race checks' }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install workspace dependencies
        run: |
          . ./native/evostack/prepare-env.ps1
          pnpm install --frozen-lockfile --store-dir native/evostack/.cache/pnpm-store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeated Go race checks
        run: ./native/evostack/test-race.ps1
      - name: Build, validate contracts, and smoke test Portable
        run: |
          if (Test-Path -LiteralPath native/evostack/dist) { throw 'Clean-build gate expected no existing dist directory' }
          ./native/evostack/build.ps1 -ExpectedRevision $env:EVOSTACK_EXPECTED_REVISION
      - name: Verify source is unchanged before upload
        run: ./native/evostack/verify-source.ps1 -ExpectedRevision $env:EVOSTACK_EXPECTED_REVISION
      - uses: actions/upload-artifact@v7
        with:
          name: TinyCherry-EvoStack-win-x64-${{ github.sha }}
          path: native/evostack/dist/TinyCherry-EvoStack-win-x64-portable.zip
          if-no-files-found: error
          retention-days: 7
