[package]
name = "tinycherry-evostack"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "TinyCherry"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false }
wry = { version = "=0.57.3", default-features = false, features = ["os-webview"] }
async-channel = "2"

[features]
default = []
inspection = ["wry/devtools"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
